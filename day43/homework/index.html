<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">

    <div class="card">

        <div class="left">
            <h3>Your Result</h3>

            <div class="circle">
                <h1>76</h1>
                <span>of 100</span>
            </div>

            <h2>Great</h2>

            <p>
                You scored higher than 65% of the people
                who have taken these tests.
            </p>
        </div>

        <div class="right">

            <h3>Summary</h3>

            <div class="row">
                <span>Reaction</span>
                <b>80 / 100</b>
            </div>

            <div class="row">
                <span>Memory</span>
                <b>92 / 100</b>
            </div>

            <div class="row">
                <span>Verbal</span>
                <b>61 / 100</b>
            </div>

            <div class="row">
                <span>Visual</span>
                <b>73 / 100</b>
            </div>

            <button>Continue</button>

        </div>

    </div>

</div>

</body>
</html>
