<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
  <style>
    body {
      background-color: lightblue;
      font-family: Arial;
    }

    h1 {
      text-align: center;
      text-shadow: 2px 2px gray;
    }

    h2 {
      text-transform: uppercase;
      color: darkblue;
    }

    .menu {
      background-color: lightgray;
      text-align: center;
      padding: 10px;
    }

    .menu li {
      list-style: none;
      margin: 5px;
      font-weight: bold;
    }

    .text {
      background-color: white;
      padding: 10px;
      text-decoration: underline;
    }

    button {
      background-color: red;
      color: white;
      padding: 10px;
      border: none;
    }
  </style>

</head>
<body>

<h1>ჩემი ვებგვერდი</h1>

<h2>მენიუ</h2>

<ul class="menu">
  <li>მთავარი</li>
  <li>ჩემ შესახებ</li>
  <li>კონტაქტი</li>
</ul>

<p class="text">
  <b>ეს არის</b> <i>ჩემი</i> <u>საიტი</u>
</p>

<img src="https://via.placeholder.com/200">

<br><br>

<button>დაჭირე</button>

</body>
</html>
