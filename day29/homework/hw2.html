<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>

.box1 {
    min-width: 200px;
    background: lightblue;
}

.box2 {
    max-width: 400px;
    background: lightgreen;
}

.box3 {
    width: 50%;
    min-width: 300px;
    background: lightcoral;
}

.box4 {
    width: 100%;
    max-width: 600px;
    background: lightyellow;
}

.box5 {
    min-width: 150px;
    max-width: 350px;
    background: lightgray;
}

div {
    margin: 10px;
    padding: 20px;
}

</style>
</head>
<body>

<div class="box1">min-width example</div>
<div class="box2">max-width example</div>
<div class="box3">width + min-width</div>
<div class="box4">width + max-width</div>
<div class="box5">min + max width</div>

    
</body>
</html>
