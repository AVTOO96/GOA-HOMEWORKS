<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>

/* Box Model */
.card {
    max-width: 400px;
    min-width: 250px;
    margin: 20px auto;
    padding: 20px;
    border: 3px solid black;
    background: #f5f5f5;
}

/* Inline */
.card span {
    color: red;
}

/* Block */
.card h2 {
    margin-bottom: 10px;
}

button {
    padding: 10px 20px;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
}

</style>

</head>
<body>

<div class="card">
    <h2>სათაური</h2>
    <p>
        ეს არის ტექსტი სადაც <span>inline ელემენტი</span> გამოიყენება.
    </p>
    <button>დაჭირე</button>
</div>

<div class="card">
    <h2>მეორე ბარათი</h2>
    <p>
        min-width და max-width მუშაობს ამ ელემენტზე.
    </p>
    <button>ნახვა</button>
</div>
</body>
</html>
