<!-- video tag გამოიყენება ვიდეოს ჩასასმელად ვებგვერდზე -->
<video controls width="300">
    <!-- source tag მიუთითებს ვიდეოს ფაილს -->
    <source src="video.mp4" type="video/mp4">
</video>

<!-- audio tag გამოიყენება აუდიოს ჩასასმელად -->
<audio controls>
    <!-- source tag აქაც მიუთითებს აუდიოს ფაილს -->
    <source src="audio.mp3" type="audio/mpeg">
</audio>

<!-- Attributes (ატრიბუტები) -->

<!-- src - ფაილის მისამართი -->
<!-- type - ფაილის ტიპი (mp4, mp3 და ა.შ) -->
<!-- controls - აჩვენებს play/pause ღილაკებს -->
<!-- autoplay - ავტომატურად იწყებს -->
<!-- loop - მუდმივად იმეორებს -->
<!-- muted - ხმა გათიშულია -->
