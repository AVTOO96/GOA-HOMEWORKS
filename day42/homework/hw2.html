<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Z-Index Example</title>

  <style>
    .box1 {
      width: 200px;
      height: 200px;
      background: red;
      position: absolute;
      top: 50px;
      left: 50px;
      z-index: 1;
    }

    .box2 {
      width: 200px;
      height: 200px;
      background: blue;
      position: absolute;
      top: 100px;
      left: 100px;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="box1"></div>
  <div class="box2"></div>

</body>
</html>
